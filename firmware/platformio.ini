[platformio]
default_envs = thinkie-rx-a, thinkie-rx-b
boards_dir = boards

[env]
platform = espressif32@6.3.0
framework = arduino
board = LilyGo-T-TWR-Plus
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default, time
lib_deps =
    olikraus/U8g2@^2.35.9
    adafruit/Adafruit NeoPixel@^1.12.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=2
    -Wno-format

; ---- Stage 1/2: receive + speaker playback. All PTT / transmit code compiled out.
[env:thinkie-rx-a]
build_flags = ${env.build_flags} -DTWR_TX_DISABLED=1 -DTWR_BOARD_ID=65
[env:thinkie-rx-b]
build_flags = ${env.build_flags} -DTWR_TX_DISABLED=1 -DTWR_BOARD_ID=66

; ---- Stage 3: transmit-capable. Boots disarmed; host must send TX_ARM each session.
; Flash only with explicit approval (see docs/regulatory.md).
[env:thinkie-tx-a]
build_flags = ${env.build_flags} -DTWR_BOARD_ID=65
[env:thinkie-tx-b]
build_flags = ${env.build_flags} -DTWR_BOARD_ID=66
[env:thinkie-tx-c]
build_flags = ${env.build_flags} -DTWR_BOARD_ID=67
