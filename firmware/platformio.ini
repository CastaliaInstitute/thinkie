[platformio]
default_envs = twr-rx
boards_dir = boards

[env]
platform = espressif32@6.3.0
framework = arduino
board = LilyGo-T-TWR-Plus
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default, time
lib_deps =
    olikraus/U8g2@^2.35.9
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=2
    -Wno-format

; Stage 1: receive-only. All PTT / transmit code is compiled out.
[env:twr-rx]
build_flags =
    ${env.build_flags}
    -DTWR_TX_DISABLED=1
